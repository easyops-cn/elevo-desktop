[[permission]]
identifier = "allow-desktop-commands"
description = "Allow the main desktop window to call Elevo Messenger desktop commands."
commands.allow = [
  "open_side_panel",
  "open_preview_window",
  "open_code_view_window",
  "open_bridge_explorer_window",
  "open_task_board_window",
  "open_oauth_window",
  "send_to_all_webviews",
  "send_to_webview",
  "set_theme",
  "update_tray_badge",
  "update_menu_state",
]

[[permission]]
identifier = "allow-open-side-panel"
description = "Allow local desktop windows to open workspace side panels."
commands.allow = [
  "open_side_panel",
]

[[permission]]
identifier = "allow-open-bridge-explorer-window"
description = "Allow local desktop windows to open the bridge workspace explorer window."
commands.allow = [
  "open_bridge_explorer_window",
]

[[permission]]
identifier = "allow-relay-sdk-message"
description = "Allow standalone local windows to relay SDK messages to the main window."
commands.allow = [
  "relay_sdk_message",
]
