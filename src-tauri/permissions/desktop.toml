[[permission]]
identifier = "allow-desktop-commands"
description = "Allow the main desktop window to call Elevo Messenger desktop commands."
commands.allow = [
  "open_side_panel",
  "open_preview_window",
  "open_code_view_window",
  "open_oauth_window",
  "send_to_all_webviews",
  "set_theme",
  "update_tray_badge",
  "update_menu_state",
]
